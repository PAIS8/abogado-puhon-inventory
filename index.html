/* Layout: phone-first single column (max 680px), sticky lavender header, fixed bottom tabs, bottom sheets for every form. Palette: Lavender Tea Dress Pastel. */
:root{
  --lav:#E6DCF3; --violet:#D7C8EC; --frost:#D9E8F6; --piglet:#FBDCE6; --glint:#FBF3DA;
  --bg:#FBF3DA; --card:#FFFFFF; --ink:#33294F; --muted:#6B6285; --line:#E7DDC4;
  --head:#E6DCF3; --head-ink:#33294F;
  --accent:#6A54A8; --accent-ink:#FFFFFF; --accent-soft:#E6DCF3;
  --deep:#4A3B73; --deep-ink:#FFFFFF; --deep-label:#D7C8EC;
  --soft:#FBDCE6; --soft-ink:#7A2E4E;
  --sun-soft:#F6E7B0; --sun-ink:#6B4E0A;
  --blush-soft:#FBDCE6; --bad:#B0304F; --good:#2D7A5A; --good-soft:#DDF0E6;
  --pick:#D7C8EC; --pick-ink:#3B2D63; --bar1:#9DBBE0; --bar2:#B8A2DE; --bar3:#EE9DBA; --ini:#9C86CC; --dot:#F4A6C0;
  --shadow:0 1px 2px rgba(74,59,115,.07),0 3px 10px rgba(74,59,115,.07);
  --f-display:"Fredoka","Nunito Sans",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1A2F; --card:#292440; --ink:#F2EEF8; --muted:#B2ABCD; --line:#3B3659;
  --head:#2F2851; --head-ink:#E6DCF3;
  --accent:#CDBBF0; --accent-ink:#1E1A2F; --accent-soft:#3A3262;
  --deep:#D7C8EC; --deep-ink:#2A2244; --deep-label:#4A3B73;
  --soft:#4B2F44; --soft-ink:#FBDCE6;
  --sun-soft:#463B25; --sun-ink:#F4E3A8;
  --blush-soft:#4B2739; --bad:#F29AAB; --good:#86D3AE; --good-soft:#1F3B39;
  --pick:#5A4A91; --pick-ink:#F4EEFB; --bar1:#7FA3D4; --bar2:#A48ED4; --bar3:#E58AAB; --ini:#8E78C4; --dot:#E58AAB;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1E1A2F; --card:#292440; --ink:#F2EEF8; --muted:#B2ABCD; --line:#3B3659;
  --head:#2F2851; --head-ink:#E6DCF3;
  --accent:#CDBBF0; --accent-ink:#1E1A2F; --accent-soft:#3A3262;
  --deep:#D7C8EC; --deep-ink:#2A2244; --deep-label:#4A3B73;
  --soft:#4B2F44; --soft-ink:#FBDCE6;
  --sun-soft:#463B25; --sun-ink:#F4E3A8;
  --blush-soft:#4B2739; --bad:#F29AAB; --good:#86D3AE; --good-soft:#1F3B39;
  --pick:#5A4A91; --pick-ink:#F4EEFB; --bar1:#7FA3D4; --bar2:#A48ED4; --bar3:#E58AAB; --ini:#8E78C4; --dot:#E58AAB;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:680px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
header.top img{width:42px;height:42px;border-radius:50%;flex:none;background:var(--glint)}
header.top h1{font:600 19px/1.15 var(--f-display);margin:0;letter-spacing:.01em}
header.top .sub{font:500 13px var(--f-body);opacity:.8}
.iconbtn{background:transparent;border:0;padding:8px;border-radius:10px;color:inherit;display:inline-flex;cursor:pointer}
.iconbtn svg{width:22px;height:22px}
main{padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.flat{padding:2px 14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}.tiny{font-size:12px}
.bold{font-weight:700}
.money{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.search:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap;font-weight:600}
.chip.on{background:var(--pick);color:var(--pick-ink);border-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;text-align:left;cursor:pointer;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.tile:active{transform:scale(.98)}
.ph{aspect-ratio:1/1;width:100%;max-width:100%;background:var(--sun-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{font:700 30px var(--f-display);color:var(--ini)}
.tile .tb{padding:9px 11px 11px}
.tile .nm{font:600 16px/1.2 var(--f-display)}
.tile .pr{font:600 15px var(--f-display);color:var(--accent);margin-top:3px}
.tile .st{font-size:12px;color:var(--muted)}
.tile .qty{position:absolute;top:8px;right:8px;background:var(--deep);color:var(--deep-ink);border-radius:999px;min-width:28px;height:28px;padding:0 8px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.thumb{width:52px;height:52px;border-radius:12px;flex:none;aspect-ratio:auto}
.thumb .ini{font-size:20px}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.badge.low{background:var(--sun-soft);color:var(--sun-ink)}
.badge.out{background:var(--blush-soft);color:var(--bad)}
.badge.good{background:var(--good-soft);color:var(--good)}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.vp{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--bg);display:flex;justify-content:space-between;gap:6px;border:1px solid var(--line)}
.vp b{font-variant-numeric:tabular-nums}
.vp.low b{color:var(--sun-ink)}.vp.out b{color:var(--bad)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.click{cursor:pointer}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--deep);color:var(--deep-ink)}
.btn.ink{background:var(--deep);color:var(--deep-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--blush-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs .in{display:flex;width:100%;max-width:680px}
nav.tabs button{flex:1;background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs .dot{position:absolute;top:4px;left:calc(50% + 8px);background:var(--dot);color:#3a1720;font-size:10px;font-weight:800;border-radius:99px;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center}
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.cartbar button{pointer-events:auto;width:100%;max-width:656px;display:flex;align-items:center;gap:10px;background:var(--deep);color:var(--deep-ink);border:0;border-radius:16px;padding:14px 16px;font:600 17px var(--f-display);box-shadow:0 8px 24px rgba(48,49,111,.35);cursor:pointer}
.cartbar .n{background:var(--soft);color:var(--soft-ink);border-radius:9px;padding:1px 9px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:600}
.stat .val{font:600 23px var(--f-display);margin-top:2px;font-variant-numeric:tabular-nums}
.stat.hl{background:var(--deep);color:var(--deep-ink);border-color:var(--deep)}
.stat.hl .lbl{color:var(--deep-label)}
.stat.sun{background:var(--soft);color:var(--soft-ink);border-color:var(--soft)}
.stat.sun .lbl{color:var(--soft-ink);opacity:.8}
h2{font:600 17px var(--f-display);margin:20px 0 8px}
h2:first-child{margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--bar1),var(--bar2),var(--bar3));border-radius:99px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.note{background:var(--sun-soft);color:var(--sun-ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.overlay{position:fixed;inset:0;background:rgba(24,24,58,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;border-radius:20px 20px 0 0;overflow:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
.sheet .hd{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:8px;z-index:2}
.sheet .hd h3{margin:0;font:600 20px var(--f-display);flex:1;min-width:0}
#dlg .overlay{align-items:center;z-index:60}
#dlg .box{background:var(--card);border-radius:18px;padding:18px;width:min(92vw,400px);box-shadow:0 10px 40px rgba(0,0,0,.3)}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.overlay,.sheet{animation:none}}
.field{margin-bottom:12px}
.field label,.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);flex:none}
.stepper button{background:none;border:0;width:40px;height:40px;font-size:20px;cursor:pointer;color:var(--accent);font-weight:800}
.stepper input{width:44px;text-align:center;border:0;background:none;height:40px;outline:none;font-weight:700;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.sumrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;gap:10px}
.total{display:flex;justify-content:space-between;font:600 22px var(--f-display);padding:8px 0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:600;line-height:1.2}
.seg button.on{background:var(--pick);color:var(--pick-ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.seg button small{display:block;font-size:12px;font-weight:600;opacity:.85}
.switch{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;margin-bottom:12px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--deep);color:var(--deep-ink);padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.dayhd{font-size:12px;font-weight:800;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.tag.in{background:var(--good-soft);color:var(--good)}
.tag.adj,.tag.pre{background:var(--sun-soft);color:var(--sun-ink)}
.tag.void,.tag.due{background:var(--blush-soft);color:var(--bad)}
.strike{text-decoration:line-through;opacity:.6}
.slip{background:var(--card);border:1px dashed var(--violet);border-radius:14px;padding:14px;font-size:14px}
.slip .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.slip hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
.pltable{width:100%;border-collapse:collapse;font-size:14px}
.pltable th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:4px}
.pltable td{padding:4px}
.pltable input{width:100%;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-variant-numeric:tabular-nums}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;color:var(--muted)}
.loading img{width:96px;height:96px;border-radius:50%}
.sync{display:inline-block;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--soft);color:var(--soft-ink);font-size:11px;font-weight:800}
.codebox{max-width:420px;margin:12vh auto 0}
</style>

let ST={};               // derived stock per variant key
let MODE='loading', READY=false, OFFLINE_NOTE=false;
const U={tab:'sell',q:'',cat:'All',cart:[],sq:'',scat:'All',sfilter:'all',ofilter:'unpaid',period:'month',hfilter:'all'};

/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const peso=n=>'₱'+r2(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const pesoS=n=>{n=r2(n);return '₱'+(Number.isInteger(n)?n.toLocaleString('en-PH'):n.toLocaleString('en-PH',{minimumFractionDigits:2}))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const P=id=>S.products.find(p=>p.id===id);
const vk=(pid,size,fin)=>pid+'|'+size+'|'+fin;
function dkey(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDay(t){const k=dkey(t);if(k===dkey(Date.now()))return 'Today';if(k===dkey(Date.now()-864e5))return 'Yesterday';return new Date(t).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
const fmtTime=t=>new Date(t).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
const daysAgo=t=>Math.floor((Date.now()-t)/864e5);
let toastT;function toast(m){clearTimeout(toastT);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=m;toastT=setTimeout(()=>el.remove(),2000)}
const cfg=()=>S.settings||DEFAULT_SETTINGS;
function pl(cat){const p=cfg().prices[cat];return p||{Standard:{price:0,cost:0},Mini:{price:0,cost:0}}}
function vPrice(p,size,fin){if(p.simple)return r2(+p.price||0);return r2((+pl(p.cat)[size].price||0)+(fin==='Glittery'?(+cfg().glitter.price||0):0))}
function vCost(p,size,fin){if(p.simple)return r2(+p.cost||0);return r2((+pl(p.cat)[size].cost||0)+(fin==='Glittery'?(+cfg().glitter.cost||0):0))}
function stockOf(pid,size,fin){return ST[vk(pid,size,fin)]||0}
function VARS(p){return p&&p.simple?[['One','-']]:SIZES.flatMap(s=>FINS.map(f=>[s,f]))}
function varLabel(s,f,short){return s==='One'?'':(short?(SZ[s]||s):s)+(short?' ':', ')+f}
function totalStock(pid){return VARS(P(pid)).reduce((t,[s,f])=>t+stockOf(pid,s,f),0)}
function catList(){const c=[...cfg().cats];S.products.forEach(p=>{if(!p.hidden&&p.cat&&!c.includes(p.cat))c.push(p.cat)});return c}
function vState(n){const low=+cfg().low||0;return n<=0?'out':n<=low?'low':'ok'}
function pState(pid){const t=totalStock(pid);return t<=0?'out':vState(t)}
function photoSrc(p){return p?((S.photos&&S.photos[p.id])||p.img||''):''}
function phHTML(p,cls){const s=photoSrc(p);return `<div class="ph ${cls||''}">${s?`<img src="${esc(s)}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="ini">${esc((p.name||'?').replace(/^(AP|J1MC)\s*/i,'').slice(0,2).toUpperCase())}</span>`}</div>`}
function itemLabel(i){return i.size==='One'?esc(i.name):`${esc(i.name)} <span class="muted">(${SZ[i.size]||esc(i.size)}, ${esc(i.fin)})</span>`}
function itemText(i){return `${i.qty} x ${i.name}`+(i.size==='One'?'':` (${i.size}, ${i.fin})`)}

/* ===== derived data ===== */
function recalc(){ST={};
  for(const m of S.moves){if(m.void||m.imported)continue;
    if(m.type==='sale'){if(m.status==='preorder')continue;m.items.forEach(i=>{const k=vk(i.pid,i.size,i.fin);ST[k]=(ST[k]||0)-i.qty})}
    else if(m.type==='in'||m.type==='adj'){m.items.forEach(i=>{const k=vk(i.pid,i.size,i.fin);ST[k]=(ST[k]||0)+i.qty})}
  }}
function customers(){const map={};const get=n=>{const k=n.trim().toLowerCase();return map[k]=map[k]||{name:n.trim(),owed:0,paid:0,last:0,sales:[],pays:[]}};
  S.moves.forEach(m=>{if(m.void||!m.customer)return;const c=get(m.customer);
    if(m.type==='sale'){c.owed+=m.total;c.paid+=(+m.paid||0);c.sales.push(m);c.last=Math.max(c.last,m.t)}
    else if(m.type==='pay'){c.paid+=m.total;c.pays.push(m);c.last=Math.max(c.last,m.t)}});
  return Object.values(map).map(c=>({...c,bal:r2(c.owed-c.paid)}))}
function preorders(){return S.moves.filter(m=>m.type==='sale'&&!m.void&&m.status==='preorder').sort((a,b)=>a.t-b.t)}

/* ===== storage and sync (Google Sheet through Apps Script) ===== */
const CFG=window.APP_CONFIG||{};
const LKEY='abogado-puhon-inventory-v1',CKEY='ap-cache-v2',OKEY='ap-outbox-v2',CODEKEY='ap-code-v1';
let VER='0',OUT=[],FLUSHING=false,PULLING=false,NEEDCODE=false,CODE_ERR='',CODE='',LASTSYNC=0;
function lget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ldel(k){try{localStorage.removeItem(k)}catch(e){}}
function saveLocal(){lset(MODE==='local'?LKEY:CKEY,JSON.stringify({S,VER}))}
function loadLocal(){try{const d=JSON.parse(lget(MODE==='local'?LKEY:CKEY)||'null');if(d&&d.S&&d.S.products){S=d.S;S.photos=S.photos||{};VER=d.VER||'0'}}catch(e){}}
function q(op){if(MODE==='local'){saveLocal();return}OUT=OUT.filter(o=>!(o.col===op.col&&o.id===op.id));OUT.push(op);lset(OKEY,JSON.stringify(OUT));saveLocal();flush()}
const wSettings=()=>q({op:'set',col:'settings',id:'main',data:clone(S.settings)});
const wProduct=p=>q({op:'set',col:'products',id:p.id,data:clone(p)});
const wMove=m=>q({op:'set',col:'moves',id:m.id,data:clone(m)});
const wPhoto=id=>q({op:'set',col:'photos',id,data:{d:S.photos[id]}});
const dDoc=(col,id)=>q({op:'del',col,id});
function addMove(m){S.moves.push(m);S.moves.sort((a,b)=>a.t-b.t);recalc();wMove(m)}
function apiUrl(params){const u=new URL(CFG.API_URL);for(const k in params)u.searchParams.set(k,params[k]);return u.toString()}
async function apiGet(params){const r=await fetch(apiUrl(params),{redirect:'follow'});return r.json()}
async function apiPost(body){const r=await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});return r.json()}
async function flush(){
  if(MODE!=='sheet'||FLUSHING||!OUT.length||NEEDCODE)return;
  FLUSHING=true;let ok=true;
  try{while(OUT.length){const batch=OUT.slice(0,15);const r=await apiPost({code:CODE,ops:batch});
      if(!r.ok){if(r.error==='code'){askCode('That store code was not accepted.');ok=false;break}throw new Error(r.error||'save failed')}
      OUT=OUT.filter(o=>!batch.includes(o));lset(OKEY,JSON.stringify(OUT))}}
  catch(e){ok=false;OFFLINE_NOTE=true;setTimeout(flush,8000)}
  FLUSHING=false;
  if(ok){OFFLINE_NOTE=false;await pull(true)}else if(READY)softRender();
}
async function pull(force){
  if(MODE!=='sheet'||PULLING||FLUSHING||OUT.length||NEEDCODE)return;
  PULLING=true;const was=OFFLINE_NOTE;let changed=false;
  try{const r=await apiGet({action:'all',code:CODE,since:force?'':VER});
    if(!r.ok){if(r.error==='code'){askCode('That store code was not accepted.');PULLING=false;return}throw new Error(r.error||'load failed')}
    OFFLINE_NOTE=false;LASTSYNC=Date.now();
    if(!r.same){VER=String(r.ver);S.settings=r.settings||null;S.products=r.products||[];S.moves=(r.moves||[]).sort((a,b)=>a.t-b.t);S.photos=r.photos||{};recalc();saveLocal();changed=true}
    if(!READY){READY=true;render()}else if(changed||was)softRender()}
  catch(e){OFFLINE_NOTE=true;if(!READY){READY=true;render()}else if(!was)softRender()}
  PULLING=false}
function askCode(msg){NEEDCODE=true;CODE_ERR=msg||'';CODE='';ldel(CODEKEY);READY=true;render()}
function submitCode(){const v=($('#codeIn').value||'').trim();if(!v){toast('Type the store code.');return}CODE=v;lset(CODEKEY,v);NEEDCODE=false;CODE_ERR='';OFFLINE_NOTE=false;render();flush();pull(true)}
function unlockScreen(){return `<header class="top"><img src="${LOGO}" alt=""><div class="grow"><h1>Abogado Puhon</h1><div class="sub">Inventory</div></div></header>
<main><div class="card codebox"><h2>Store code</h2><p class="muted small">Type the store code to open the inventory on this device. You only need to do this once.</p>${CODE_ERR?`<div class="note">${esc(CODE_ERR)}</div>`:''}
<div class="field"><label for="codeIn">Store code</label><input id="codeIn" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitCode()"></div><button class="btn ink block" onclick="submitCode()">Open</button></div></main>`}
function syncTxt(){if(MODE!=='sheet')return '';if(OUT.length)return `<span class="sync">Saving ${OUT.length}</span>`;if(OFFLINE_NOTE)return '<span class="sync">Offline</span>';return ''}
async function init(){
  MODE=CFG.API_URL?'sheet':'local';
  loadLocal();
  if(MODE==='local'){READY=true;recalc();render();return}
  try{OUT=JSON.parse(lget(OKEY)||'[]')}catch(e){OUT=[]}
  CODE=lget(CODEKEY)||'';
  if(S.settings||S.products.length){READY=true;recalc();render()}
  if(!CODE){askCode('');return}
  setTimeout(()=>{if(!READY){OFFLINE_NOTE=true;READY=true;render()}},10000);
  await flush();await pull(true);
  setInterval(()=>{if(!document.hidden){flush();pull()}},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){flush();pull()}});
  addEventListener('online',()=>{flush();pull()});
}
function softRender(){const a=document.activeElement;const id=a&&a.id&&$('#app').contains(a)?a.id:null;const pos=id&&a.selectionStart;render();if(id){const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}}

/* ===== dialogs ===== */
function sheet(title,body){$('#layer').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="hd"><h3 class="ell">${esc(title)}</h3><button class="iconbtn" onclick="closeSheet()" aria-label="Close">${IC.close}</button></div>${body}</div></div>`;document.body.style.overflow='hidden'}
function closeSheet(){$('#layer').innerHTML='';document.body.style.overflow=''}
let DLG=null;
function ask(msg,okLabel,fn,danger){DLG=fn;$('#dlg').innerHTML=`<div class="overlay"><div class="box"><div style="margin-bottom:16px">${msg}</div><div class="btns"><button class="btn line" onclick="closeDlg()">Cancel</button><button class="btn ${danger?'danger':''}" onclick="const f=DLG;closeDlg();f&&f()">${esc(okLabel)}</button></div></div></div>`}
function askText(title,val,fn){DLG=fn;$('#dlg').innerHTML=`<div class="overlay"><div class="box"><div class="field"><label for="dlgIn">${esc(title)}</label><input id="dlgIn" value="${esc(val||'')}"></div><div class="btns"><button class="btn line" onclick="closeDlg()">Cancel</button><button class="btn" onclick="const v=$('#dlgIn').value.trim();const f=DLG;closeDlg();if(v&&f)f(v)">OK</button></div></div></div>`;setTimeout(()=>$('#dlgIn')&&$('#dlgIn').focus(),50)}
function closeDlg(){$('#dlg').innerHTML='';DLG=null}

/* ===== shell ===== */
function render(){
  const app=$('#app');
  if(!READY)return;
  if(NEEDCODE){app.innerHTML=unlockScreen();return}
  if(!S.settings){app.innerHTML=welcome();return}
  const titles={sell:'New order',stock:'Designs & stock',orders:'Utang & pre-orders',report:'Reports',hist:'History'};
  const owed=customers().filter(c=>c.bal>0.004).length+preorders().length;
  const low=S.products.filter(p=>!p.hidden&&pState(p.id)!=='ok').length;
  app.innerHTML=`
  <header class="top"><img src="${LOGO}" alt="">
    <div class="grow"><h1 class="ell">${esc(cfg().store)}</h1><div class="sub">${titles[U.tab]}${syncTxt()}</div></div>
    <button class="iconbtn" onclick="openSettings()" aria-label="Settings">${IC.gear}</button></header>
  <main>${OFFLINE_NOTE?'<div class="note">Can\'t reach the saved data yet. Check the internet. What you see may be out of date.</div>':''}${MODE==='local'?'<div class="note">Not connected to the shared Google Sheet yet. Saved on this device only.</div>':''}
  ${({sell:vSell,stock:vStock,orders:vOrders,report:vReport,hist:vHist})[U.tab]()}</main>
  ${U.tab==='sell'?cartBar():''}
  <nav class="tabs"><div class="in">${tb('sell','Sell')}${tb('stock','Stock',low)}${tb('orders','Orders',owed)}${tb('report','Reports')}${tb('hist','History')}</div></nav>`;
}
function tb(k,l,n){return `<button class="${U.tab===k?'on':''}" onclick="go('${k}')">${IC[k==='orders'?'orders':k]}${n?`<span class="dot">${n}</span>`:''}<span>${l}</span></button>`}
function go(t){U.tab=t;render();window.scrollTo(0,0)}
function welcome(){return `<header class="top"><img src="${LOGO}" alt=""><div class="grow"><h1>Abogado Puhon</h1><div class="sub">Inventory</div></div></header>
<main><div class="card"><h2>Set up the store</h2><p class="muted small">This starts the store with the Abogado Puhon price list and designs (J1MC, AP designs, Codal, Codal Outlined, stickers, the glittery add-on and the mix-and-match discount). You can change prices any time in Settings. To bring in the stock count and past orders, restore the starting-data file instead.</p>
<div class="field"><label for="wStore">Store name</label><input id="wStore" value="Abogado Puhon"></div>
<button class="btn ink block" onclick="startStore()">Start</button>
<button class="btn line block" style="margin-top:8px" onclick="pickRestore()">Restore from a backup file</button></div></main>`}
function startStore(){S.settings=clone(DEFAULT_SETTINGS);S.settings.store=($('#wStore').value||'').trim()||'Abogado Puhon';S.products=clone(DEFAULT_PRODUCTS);wSettings();S.products.forEach(wProduct);recalc();render()}

/* ===== SELL ===== */
function visibleProducts(q,cat){q=(q||'').trim().toLowerCase();return S.products.filter(p=>!p.hidden&&(cat==='All'||p.cat===cat)&&(!q||p.name.toLowerCase().includes(q))).sort((a,b)=>(catList().indexOf(a.cat)-catList().indexOf(b.cat))||a.name.localeCompare(b.name))}
function catChips(cur,setter){const cats=['All',...catList()];return `<div class="chips">${cats.map((c,i)=>`<button class="chip ${c===cur?'on':''}" onclick="${setter}(${i})">${esc(c)}</button>`).join('')}</div>`}
function catByIdx(i){return ['All',...catList()][i]}
function setCat(i){U.cat=catByIdx(i);render()}
function vSell(){
  if(!S.products.filter(p=>!p.hidden).length)return `<div class="card empty">No designs yet.<br><br><button class="btn" onclick="go('stock');editProduct()">Add your first design</button></div>`;
  return `<input class="search" id="q" placeholder="Search design" value="${esc(U.q)}" oninput="U.q=this.value;$('#grid').innerHTML=gridHTML()" aria-label="Search design">
  ${catChips(U.cat,'setCat')}<div class="grid" id="grid">${gridHTML()}</div>`}
function inCart(pid){return U.cart.filter(c=>c.pid===pid).reduce((a,c)=>a+c.qty,0)}
function gridHTML(){const list=visibleProducts(U.q,U.cat);if(!list.length)return '<div class="empty" style="grid-column:1/-1">No design found.</div>';
  return list.map(p=>{const q=inCart(p.id),t=totalStock(p.id),st=pState(p.id),pr=p.simple?[vPrice(p)]:SIZES.map(s=>vPrice(p,s,'Glossy'));
  return `<button class="tile" onclick="pickVariant('${p.id}')">${phHTML(p)}${q?`<span class="qty">${q}</span>`:''}<div class="tb"><div class="nm ell">${esc(p.name)}</div><div class="pr">${pr.length>1?pesoS(Math.min(...pr))+' to '+pesoS(Math.max(...pr)):pesoS(pr[0])}</div><div class="st" style="${st==='out'?'color:var(--bad)':st==='low'?'color:var(--sun-ink)':''}">${t<=0?'No stock (pre-order)':t+' in stock'}</div></div></button>`}).join('')}
let PV={};
function pickVariant(pid){const p=P(pid);PV={pid,size:p.simple?'One':PV.pid===pid?PV.size:'Standard',fin:p.simple?'-':PV.pid===pid?PV.fin:'Glossy',qty:1};drawPV()}
function drawPV(){const p=P(PV.pid);const n=stockOf(p.id,PV.size,PV.fin);const pr=vPrice(p,PV.size,PV.fin);
  sheet(p.name,`<div class="row" style="align-items:flex-start;margin-bottom:14px">${phHTML(p,'thumb" style="width:96px;height:96px')}<div class="grow"><div class="muted small">${esc(p.cat)}</div><div class="disp" style="font-size:28px;font-weight:600;color:var(--accent)">${pesoS(pr)}</div><div class="small">${n>0?`<span class="badge ${vState(n)==='low'?'low':'good'}">${n} in stock</span>`:'<span class="badge out">None in stock: pre-order</span>'}</div></div></div>
  ${p.simple?'':`<div class="lab">Size</div><div class="seg" style="margin-bottom:12px">${SIZES.map(s=>`<button class="${PV.size===s?'on':''}" onclick="PV.size='${s}';drawPV()">${s}<small>${pesoS(vPrice(p,s,PV.fin))} &middot; ${stockOf(p.id,s,PV.fin)} left</small></button>`).join('')}</div>
  <div class="lab">Finish</div><div class="seg" style="margin-bottom:14px">${FINS.map(f=>`<button class="${PV.fin===f?'on':''}" onclick="PV.fin='${f}';drawPV()">${f}<small>${f==='Glittery'?'+'+pesoS(cfg().glitter.price):'regular'} &middot; ${stockOf(p.id,PV.size,f)} left</small></button>`).join('')}</div>`}
  <div class="row" style="margin-bottom:14px"><div class="grow lab" style="margin:0">Quantity</div><div class="stepper"><button onclick="PV.qty=Math.max(1,PV.qty-1);drawPV()" aria-label="Less">-</button><input id="pvq" type="number" inputmode="numeric" value="${PV.qty}" onchange="PV.qty=Math.max(1,parseInt(this.value)||1);drawPV()" aria-label="Quantity"><button onclick="PV.qty++;drawPV()" aria-label="More">+</button></div></div>
  <button class="btn ink block" onclick="addToCart()">Add to order &middot; ${pesoS(pr*PV.qty)}</button>`)}
function addToCart(){const ex=U.cart.find(c=>c.pid===PV.pid&&c.size===PV.size&&c.fin===PV.fin);if(ex)ex.qty+=PV.qty;else U.cart.push({pid:PV.pid,size:PV.size,fin:PV.fin,qty:PV.qty});closeSheet();render();toast('Added to order.')}
function cartLines(){return U.cart.filter(c=>P(c.pid)).map(c=>{const p=P(c.pid);return {...c,name:p.name,price:vPrice(p,c.size,c.fin),cost:vCost(p,c.size,c.fin)}})}
function cartSub(){return r2(cartLines().reduce((a,c)=>a+c.price*c.qty,0))}
function autoDisc(lines){const d=cfg().discounts;let off=0;SIZES.forEach(s=>{const n=lines.filter(l=>l.size===s).reduce((a,l)=>a+l.qty,0);off+=n>=4?+d.four:n===3?+d.three:n===2?+d.two:0});return off}
function cartBar(){const n=U.cart.reduce((a,c)=>a+c.qty,0);if(!n)return '';const lines=cartLines();const disc=U.discManual!=null?U.discManual:autoDisc(lines);
  return `<div class="cartbar"><button onclick="openCart()"><span class="n">${n}</span><span class="grow" style="text-align:left">View order</span><span class="money">${pesoS(Math.max(0,cartSub()-disc))}</span></button></div>`}
let CO={};
function openCart(){const lines=cartLines();if(!lines.length){U.cart=[];closeSheet();render();return}
  if(!CO.init){CO={init:true,customer:'',pre:false,method:'Cash',paid:null,note:''}}
  const sub=cartSub(),auto=autoDisc(lines),disc=U.discManual!=null?U.discManual:auto,tot=Math.max(0,r2(sub-disc));
  const paid=CO.paid==null?tot:CO.paid;const bal=r2(tot-paid);
  const names=customers().map(c=>c.name).sort();
  sheet('Order',`<div class="card flat"><div class="list">${lines.map((c,i)=>`<div class="item"><div class="grow"><div class="bold">${esc(c.name)}</div><div class="tiny muted">${c.size==='One'?'':c.size+', '+c.fin+' &middot; '}${pesoS(c.price)} each &middot; ${stockOf(c.pid,c.size,c.fin)} in stock</div></div><div class="stepper"><button onclick="cq(${i},-1)" aria-label="Less">-</button><input type="number" inputmode="numeric" value="${c.qty}" onchange="cs(${i},this.value)" aria-label="Quantity"><button onclick="cq(${i},1)" aria-label="More">+</button></div></div>`).join('')}</div></div>
  <div class="card"><div class="sumrow"><span class="muted">Subtotal</span><b class="money">${peso(sub)}</b></div>
  <div class="sumrow"><span class="muted">Discount <span class="tiny">${U.discManual!=null?`(changed &middot; <a href="#" onclick="U.discManual=null;openCart();return false">use promo ${pesoS(auto)}</a>)`:auto?'(mix-and-match promo)':''}</span></span><input class="search money" style="width:110px;text-align:right;padding:8px 10px" type="number" inputmode="decimal" value="${disc}" onchange="U.discManual=Math.max(0,+this.value||0);openCart()" aria-label="Discount"></div>
  <div class="total"><span>Total</span><span class="money">${peso(tot)}</span></div></div>
  <div class="field"><label for="coName">Customer name ${bal>0||CO.pre?'(needed)':'(optional)'}</label><input id="coName" list="coList" value="${esc(CO.customer)}" oninput="CO.customer=this.value" placeholder="e.g. Julz"><datalist id="coList">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
  <label class="switch"><input type="checkbox" ${CO.pre?'checked':''} onchange="CO.pre=this.checked;openCart()"><span class="grow"><b>Pre-order</b><br><span class="tiny muted">Not given yet. Stock goes down when you mark it as given (7 to 10 days).</span></span></label>
  <div class="lab">Payment</div><div class="seg" style="margin-bottom:10px">${['Cash','GCash'].map(m=>`<button class="${CO.method===m?'on':''}" onclick="CO.method='${m}';openCart()">${m}</button>`).join('')}</div>
  <div class="two"><div class="field"><label for="coPaid">Amount paid now</label><input id="coPaid" type="number" inputmode="decimal" value="${paid}" onchange="CO.paid=Math.max(0,+this.value||0);openCart()"></div>
  <div class="field"><label>Utang (balance)</label><input readonly value="${peso(Math.max(0,bal))}" style="${bal>0?'color:var(--bad);font-weight:700':''}"></div></div>

function saleText(m){const bal=r2(m.total-(+m.paid||0));return [cfg().store+' order'+(m.customer?' - '+m.customer:''),new Date(m.t).toLocaleDateString('en-PH',{dateStyle:'medium'}),'',...m.items.map(i=>`${itemText(i)} = ${pesoS(i.qty*i.price)}`),'',`Subtotal: ${pesoS(m.subtotal)}`,m.discount?`Discount: -${pesoS(m.discount)}`:'',`Total: ${pesoS(m.total)}`,`Paid: ${pesoS((+m.paid||0))}`,bal>0?`Balance: ${pesoS(bal)}`:'Fully paid. Thank you!',m.status==='preorder'?'Pre-order: ready in 7 to 10 days.':''].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n')}

function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'Copied. Paste it in Messenger.':'Could not copy on this device.')}

async function saveProduct(id){const name=$('#fName').value.trim();if(!name){toast('Type the design name.');return}
  if(S.products.find(p=>!p.hidden&&p.name.toLowerCase()===name.toLowerCase()&&p.id!==id)){toast(name+' is already on the list.');return}
  const own=$('#fCat').value==='__own';const extra=own?{simple:true,cat:($('#fGroup').value||'').trim()||'Others',price:+$('#fPrice').value||0,cost:+$('#fCost').value||0}:{simple:false,cat:$('#fCat').value};
  if(own&&!(extra.price>0)){toast('Type the selling price.');return}
  if(id){const p=P(id);p.name=name;Object.assign(p,extra);if(!own){delete p.price;delete p.cost}wProduct(p);closeSheet();render();toast('Saved.');return}
  const p={id:uid(),name,...extra,added:Date.now()};const f=$('#fPhoto')&&$('#fPhoto').files[0];

function hideProduct(id){const p=P(id);p.hidden=true;wProduct(p);closeSheet();render();toast('Removed from the list.')}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let M=480,qlt=.72,data='';for(let n=0;n<5;n++){let w=img.width,h=img.height;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);data=c.toDataURL('image/jpeg',qlt);if(data.length<=45000)break;M=Math.round(M*.8);qlt=Math.max(.5,qlt-.05)}URL.revokeObjectURL(url);data.length<=48000?res({data}):rej()};img.onerror=()=>rej();img.src=url})}
async function setPhoto(id,file,quiet){if(!file)return;const p=P(id);try{const {data}=await shrink(file);
  S.photos=S.photos||{};S.photos[id]=data;p.photo=true;if(MODE==='local')saveLocal();else{wPhoto(id);wProduct(p)}

  <button class="btn line block" onclick="copyText(custText(${i}))">Copy balance for Messenger</button>`);PAYM='Cash'}
let PAYM='Cash';
function custText(i){const c=CUST[i];return `Hi ${c.name}! Here is your Abogado Puhon balance:\n\n${c.sales.map(m=>`${new Date(m.t).toLocaleDateString('en-PH',{month:'short',day:'numeric'})}: ${m.items.map(itemText).join(', ')} = ${pesoS(m.total)}`).join('\n')}\n\nTotal: ${pesoS(c.owed)}\nPaid: ${pesoS(c.paid)}\nBalance: ${pesoS(c.bal)}\n\nThank you!`}
function savePay(i){const c=CUST[i];const a=r2(parseFloat($('#payAmt').value));if(!(a>0)){toast('Type the amount paid.');return}if(a>c.bal+0.004){toast('That is more than the balance of '+peso(c.bal)+'.');return}
  addMove({id:uid(),t:Date.now(),type:'pay',customer:c.name,total:a,method:PAYM,items:[]});closeSheet();render();toast(a>=c.bal?'Paid in full.':'Payment saved. Balance '+peso(c.bal-a)+'.')}
function preSheet(id){const m=S.moves.find(x=>x.id===id);const bal=r2(m.total-(+m.paid||0));
  const short=m.items.filter(i=>i.qty>stockOf(i.pid,i.size,i.fin));
  sheet('Pre-order',`<div class="slip"><div class="bold">${esc(m.customer||'Walk-in')}</div><div class="tiny muted">Ordered ${fmtDay(m.t)} &middot; day ${daysAgo(m.t)} of 7 to 10</div><hr>${m.items.map(i=>`<div class="r"><span>${i.qty} x ${itemLabel(i)}</span><span class="tiny ${stockOf(i.pid,i.size,i.fin)>=i.qty?'':'muted'}">${stockOf(i.pid,i.size,i.fin)} in stock</span></div>`).join('')}<hr>
  <div class="r bold"><span>Total</span><span>${peso(m.total)}</span></div>${bal>0?`<div class="r" style="color:var(--bad)"><span>Balance</span><span>${peso(bal)}</span></div>`:''}${m.note?`<hr><div class="small">${esc(m.note)}</div>`:''}</div>
  ${short.length?`<div class="note" style="margin-top:12px">Add the pieces to stock first when they arrive, then mark this as given.</div><button class="btn ghost block" onclick='openRestock(${JSON.stringify(short.map(i=>({pid:i.pid,size:i.size,fin:i.fin,qty:i.qty-Math.max(0,stockOf(i.pid,i.size,i.fin))})))})'>Add the missing pieces to stock</button>`:''}
  <div class="btns" style="margin-top:10px"><button class="btn line" onclick="showSale(S.moves.find(x=>x.id==='${id}'))">Details</button><button class="btn ink" style="flex:2" ${short.length?'disabled':''} onclick="markGiven('${id}')">Mark as given</button></div>`)}
function markGiven(id){const m=S.moves.find(x=>x.id===id);m.status='done';m.givenT=Date.now();recalc();wMove(m);closeSheet();render();toast('Marked as given. Stock updated.')}

/* ===== REPORTS ===== */
function range(p){const n=new Date();const day=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  if(p==='today')return [day,Infinity];if(p==='week'){const d=new Date(day);d.setDate(d.getDate()-((d.getDay()+6)%7));return [d.getTime(),Infinity]}
  if(p==='month')return [new Date(n.getFullYear(),n.getMonth(),1).getTime(),Infinity];
  if(p==='last')return [new Date(n.getFullYear(),n.getMonth()-1,1).getTime(),new Date(n.getFullYear(),n.getMonth(),1).getTime()];return [0,Infinity]}
function vReport(){const [a,b]=range(U.period);const inR=m=>!m.void&&m.t>=a&&m.t<b;
  const sales=S.moves.filter(m=>m.type==='sale'&&inR(m));
  const rev=sales.reduce((x,m)=>x+m.total,0),cost=sales.reduce((x,m)=>x+m.items.reduce((y,i)=>y+i.qty*(i.cost||0),0),0);
  const pcs=sales.reduce((x,m)=>x+m.items.reduce((y,i)=>y+i.qty,0),0),disc=sales.reduce((x,m)=>x+(m.discount||0),0);
  const coll=sales.reduce((x,m)=>x+(+m.paid||0),0)+S.moves.filter(m=>m.type==='pay'&&inR(m)).reduce((x,m)=>x+m.total,0);
  const spent=S.moves.filter(m=>m.type==='in'&&inR(m)).reduce((x,m)=>x+m.total,0);
  const utang=customers().reduce((x,c)=>x+Math.max(0,c.bal),0);
  const top={};sales.forEach(m=>m.items.forEach(i=>{const t=top[i.name]=top[i.name]||{q:0,r:0};t.q+=i.qty;t.r+=i.qty*i.price}));
  const tops=Object.entries(top).sort((x,y)=>y[1].q-x[1].q||y[1].r-x[1].r).slice(0,8),mx=tops.length?tops[0][1].q:1;
  const mix={};sales.forEach(m=>m.items.forEach(i=>{const k=i.size+' '+i.fin;mix[k]=(mix[k]||0)+i.qty}));
  const low=S.products.filter(p=>!p.hidden&&pState(p.id)!=='ok').sort((x,y)=>totalStock(x.id)-totalStock(y.id));
  return `<div class="seg" style="margin-bottom:12px">${[['today','Today'],['week','Week'],['month','Month'],['last','Last mo.'],['all','All']].map(([k,l])=>`<button class="${U.period===k?'on':''}" onclick="U.period='${k}';render()">${l}</button>`).join('')}</div>
  <div class="stats"><div class="stat hl"><div class="lbl">Sales</div><div class="val">${pesoS(rev)}</div></div><div class="stat sun"><div class="lbl">Profit</div><div class="val">${pesoS(rev-cost)}</div></div>
  <div class="stat"><div class="lbl">Pieces sold</div><div class="val">${pcs}</div></div><div class="stat"><div class="lbl">Orders</div><div class="val">${sales.length}</div></div></div>
  <div class="card" style="margin-top:12px">
  <div class="sumrow small"><span class="muted">Money received (incl. utang payments)</span><b class="money">${peso(coll)}</b></div>
  <div class="sumrow small"><span class="muted">Promo discounts given</span><b class="money">${peso(disc)}</b></div>
  <div class="sumrow small"><span class="muted">Spent on stock</span><b class="money">${peso(spent)}</b></div>
  <div class="sumrow small" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px"><span class="muted">Utang still to collect (all time)</span><b class="money" style="color:var(--bad)">${peso(utang)}</b></div></div>
  <h2>Best sellers</h2><div class="card">${tops.length?tops.map(([n,v])=>`<div style="margin-bottom:10px"><div class="row small"><span class="grow bold ell">${esc(n)}</span><span class="muted">${v.q} pcs</span><b class="money" style="min-width:74px;text-align:right">${pesoS(v.r)}</b></div><div class="bar"><i style="width:${v.q/mx*100}%"></i></div></div>`).join(''):'<div class="empty" style="padding:8px">No orders in this period.</div>'}</div>
  ${Object.keys(mix).length?`<h2>Size and finish</h2><div class="card"><div class="vgrid" style="margin:0">${SIZES.map(s=>FINS.map(f=>`<div class="vp"><span>${s} ${f}</span><b>${mix[s+' '+f]||0}</b></div>`).join('')).join('')}</div></div>`:''}
  <h2>Needs stock</h2><div class="card flat"><div class="list">${low.length?low.map(p=>`<div class="item click" onclick="productSheet('${p.id}')">${phHTML(p,'thumb" style="width:40px;height:40px')}<div class="grow bold ell">${esc(p.name)}</div><span class="badge ${pState(p.id)}">${totalStock(p.id)<=0?'None':totalStock(p.id)+' left'}</span></div>`).join(''):'<div class="empty" style="padding:12px">All designs have stock.</div>'}</div></div>
  <button class="btn line block" onclick="exportCSV()">Download orders (Excel CSV)</button>`}
function saveFile(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function exportCSV(){const [a,b]=range(U.period);const rows=[['Date','Customer','Design','Size','Finish','Qty','Price','Amount','Cost','Order total','Discount','Paid at order','Status','Payment']];
  S.moves.filter(m=>m.type==='sale'&&!m.void&&m.t>=a&&m.t<b).forEach(m=>m.items.forEach((i,k)=>rows.push([dkey(m.t),m.customer||'',i.name,i.size,i.fin,i.qty,i.price,i.qty*i.price,i.qty*(i.cost||0),k?'':m.total,k?'':m.discount||0,k?'':m.paid,m.status==='preorder'?'Pre-order':'Given',m.method||''])));
  const csv=rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\r\n');saveFile('abogado-puhon-orders-'+dkey(Date.now())+'.csv','﻿'+csv,'text/csv')}

/* ===== HISTORY ===== */
function vHist(){const f=U.hfilter;const ms=S.moves.filter(m=>f==='all'||m.type===f).sort((a,b)=>b.t-a.t).slice(0,400);let out='',last='';
  ms.forEach(m=>{const d=fmtDay(m.t);if(d!==last){out+=`<div class="dayhd">${d}</div>`;last=d}
    const tag={sale:m.status==='preorder'?'<span class="tag pre">Pre-order</span>':'<span class="tag">Order</span>',in:'<span class="tag in">Stock in</span>',adj:'<span class="tag adj">Count fix</span>',pay:'<span class="tag in">Payment</span>'}[m.type];
    const txt=m.type==='pay'?'From '+esc(m.customer):m.type==='adj'?esc(m.items[0].name+(m.items[0].size==='One'?'':' '+m.items[0].size+' '+m.items[0].fin))+' '+(m.items[0].qty>0?'+':'')+m.items[0].qty+' ('+esc(m.note)+')':(m.customer?'<b>'+esc(m.customer)+'</b>: ':'')+m.items.map(i=>esc(i.qty+' '+i.name)).join(', ');
    const due=m.type==='sale'?r2(m.total-(+m.paid||0)):0;
    out+=`<div class="card click" style="padding:10px 12px;margin-bottom:8px" onclick="openMove('${m.id}')"><div class="row"><div class="grow" style="min-width:0"><div class="row" style="gap:6px">${tag}${m.void?'<span class="tag void">Voided</span>':''}${due>0&&!m.void?'<span class="tag due">Utang</span>':''}<span class="tiny muted">${m.imported?'spreadsheet':fmtTime(m.t)}</span></div><div class="small ell ${m.void?'strike':''}" style="margin-top:4px">${txt}</div></div>${m.type!=='adj'?`<b class="money ${m.void?'strike':''}">${pesoS(m.total)}</b>`:''}</div></div>`});
  return `<div class="chips" style="padding-top:0">${[['all','All'],['sale','Orders'],['pay','Payments'],['in','Stock in'],['adj','Count fixes']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" onclick="U.hfilter='${k}';render()">${l}</button>`).join('')}</div>${out||'<div class="card empty">Nothing here yet.</div>'}`}
function openMove(id){const m=S.moves.find(x=>x.id===id);if(!m)return;if(m.type==='sale')return showSale(m);
  const title={in:'Stock in',adj:'Count fix',pay:'Utang payment'}[m.type];
  sheet(title,`<div class="slip"><div class="tiny muted">${fmtDay(m.t)}, ${fmtTime(m.t)}</div>${m.note?`<div class="small" style="margin-top:4px">${esc(m.note)}</div>`:''}<hr>
  ${m.type==='pay'?`<div class="r bold"><span>${esc(m.customer)} (${esc(m.method||'Cash')})</span><span>${peso(m.total)}</span></div>`:m.items.map(i=>`<div class="r"><span>${itemLabel(i)}</span><b>${m.type==='adj'&&i.qty>0?'+':''}${i.qty}</b></div>`).join('')+(m.type==='in'?`<hr><div class="r bold"><span>Total cost</span><span>${peso(m.total)}</span></div>`:'')}
  ${m.void?'<hr><span class="tag void">Voided</span>':''}</div>
  <div class="btns" style="margin-top:12px">${!m.void?`<button class="btn danger" onclick="voidMove('${m.id}')">Undo this</button>`:''}<button class="btn" onclick="closeSheet()">Close</button></div>`)}
function voidMove(id){const m=S.moves.find(x=>x.id===id);const msg=m.type==='sale'?'Void this order? Its pieces go back to stock and its utang is removed. It stays in History marked Voided.':m.type==='pay'?'Undo this payment? The balance goes back up.':'Undo this? The stock change is reversed.';
  ask(msg,m.type==='sale'?'Void order':'Undo',()=>{m.void=true;m.voidT=Date.now();recalc();wMove(m);closeSheet();render();toast('Done.')},true)}

/* ===== SETTINGS ===== */
function openSettings(){const c=cfg();
  sheet('Settings',`<div class="field"><label for="stName">Store name</label><input id="stName" value="${esc(c.store)}"></div>
  <h2>Price list</h2><div class="card" style="overflow-x:auto"><table class="pltable"><thead><tr><th>Group</th><th>Std sell</th><th>Std cost</th><th>Mini sell</th><th>Mini cost</th></tr></thead><tbody>
  ${c.cats.map((k,i)=>`<tr><td class="small bold">${esc(k)}</td>${['Standard','Mini'].map(s=>['price','cost'].map(f=>`<td><input type="number" inputmode="decimal" id="pl_${i}_${s}_${f}" value="${pl(k)[s][f]}" aria-label="${esc(k)} ${s} ${f}"></td>`).join('')).join('')}</tr>`).join('')}
  <tr><td class="small bold">Glittery add-on</td><td><input type="number" inputmode="decimal" id="gl_price" value="${c.glitter.price}" aria-label="Glitter price"></td><td><input type="number" inputmode="decimal" id="gl_cost" value="${c.glitter.cost}" aria-label="Glitter cost"></td><td colspan="2" class="tiny muted">added to sell and cost</td></tr></tbody></table>
  <button class="btn sm ghost" style="margin-top:8px" onclick="askText('New price group name','',v=>{if(!S.settings.cats.includes(v)){S.settings.cats.push(v);S.settings.prices[v]={Standard:{price:0,cost:0},Mini:{price:0,cost:0}};wSettings();openSettings()}})">+ Add price group</button></div>
  <h2>Mix-and-match promo</h2><div class="card"><p class="tiny muted" style="margin-top:0">Applied per size: Standard with Standard, Mini with Mini. You can still change the discount on each order.</p><div class="two" style="grid-template-columns:repeat(3,minmax(0,1fr))">
  <div class="field"><label for="d2">2 pcs off</label><input id="d2" type="number" inputmode="decimal" value="${c.discounts.two}"></div><div class="field"><label for="d3">3 pcs off</label><input id="d3" type="number" inputmode="decimal" value="${c.discounts.three}"></div><div class="field"><label for="d4">4+ pcs off</label><input id="d4" type="number" inputmode="decimal" value="${c.discounts.four}"></div></div></div>
  <div class="field"><label for="stLow">Warn when a size and finish has this many left or fewer</label><input id="stLow" type="number" inputmode="numeric" value="${c.low}"></div>
  <button class="btn ink block" onclick="saveSettings()">Save settings</button>
  <h2>Appearance</h2><div class="seg" style="margin-bottom:6px">${[['light','Light'],['dark','Dark'],['auto','Auto']].map(([k,l])=>`<button class="${(lget('ap-theme')||'light')===k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div><div class="tiny muted">Auto follows the phone's dark mode setting.</div>
  <h2>Connection</h2><div class="card"><div class="sumrow small"><span class="muted">Saved in</span><b>${MODE==='sheet'?'Google Sheet':'This device only'}</b></div>${MODE==='sheet'?`<div class="sumrow small"><span class="muted">Last updated</span><b>${LASTSYNC?fmtTime(LASTSYNC):'not yet'}</b></div><div class="sumrow small"><span class="muted">Waiting to save</span><b>${OUT.length}</b></div><div class="btns" style="margin-top:8px"><button class="btn sm ghost" onclick="flush();pull(true);toast('Checking...')">Update now</button><button class="btn sm line" onclick="askCode('');closeSheet()">Change store code</button></div>`:'<p class="tiny muted" style="margin:6px 0 0">Set the sheet link in config.js to share the data with other devices.</p>'}</div>
  <h2>Backup</h2><p class="small muted" style="margin-top:0">Everything is saved in your Google Sheet and shows on Pola's phone and laptop. A backup file is extra safety.${c.lastBackup?' Last backup: '+fmtDay(c.lastBackup)+'.':''}</p>
  <div class="btns"><button class="btn line" onclick="backup()">Download backup</button><button class="btn line" onclick="pickRestore()">Restore backup</button></div>
  <h2>Start over</h2><button class="btn danger block" onclick="ask('Erase ALL designs, orders, utang and stock? Download a backup first. This cannot be undone.','Erase everything',eraseAll,true)">Erase all data</button>
  <p class="tiny muted" style="text-align:center;margin-top:18px">Abogado Puhon Inventory v2.1</p>`)}
function setTheme(t){lset('ap-theme',t);if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);openSettings()}
function saveSettings(){const c=S.settings;c.store=$('#stName').value.trim()||'Abogado Puhon';
  c.cats.forEach((k,i)=>{c.prices[k]=c.prices[k]||{Standard:{},Mini:{}};['Standard','Mini'].forEach(s=>['price','cost'].forEach(f=>{c.prices[k][s]=c.prices[k][s]||{};c.prices[k][s][f]=+$(`#pl_${i}_${s}_${f}`).value||0}))});
  c.glitter={price:+$('#gl_price').value||0,cost:+$('#gl_cost').value||0};c.discounts={two:+$('#d2').value||0,three:+$('#d3').value||0,four:+$('#d4').value||0};c.low=parseInt($('#stLow').value)||0;
  wSettings();closeSheet();render();toast('Settings saved. New prices apply to new orders.')}
function backup(){S.settings.lastBackup=Date.now();wSettings();saveFile('abogado-puhon-backup-'+dkey(Date.now())+'.json',JSON.stringify(S),'application/json');openSettings()}
function pickRestore(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!d.products||!d.moves||!d.settings)throw 0}catch(e){toast('That file is not an Abogado Puhon backup.');return}
  ask(`Replace everything with this file? (${d.products.length} designs, ${d.moves.length} records)`,'Restore',()=>restore(d),true)};r.readAsText(f)};i.click()}
function restore(d){toast('Restoring...');d.photos=d.photos||{};
  if(MODE==='sheet'){S.products.forEach(p=>{if(!d.products.find(x=>x.id===p.id))dDoc('products',p.id)});S.moves.forEach(m=>{if(!d.moves.find(x=>x.id===m.id))dDoc('moves',m.id)});Object.keys(S.photos||{}).forEach(id=>{if(!d.photos[id])dDoc('photos',id)})}
  S={settings:d.settings,products:d.products,moves:d.moves.sort((a,b)=>a.t-b.t),photos:d.photos};recalc();
  if(MODE==='local')saveLocal();else{wSettings();S.products.forEach(wProduct);S.moves.forEach(wMove);Object.keys(S.photos).forEach(wPhoto)}
  closeSheet();render();toast('Restored.')}
function eraseAll(){if(MODE==='sheet'){S.moves.forEach(m=>dDoc('moves',m.id));S.products.forEach(p=>dDoc('products',p.id));Object.keys(S.photos||{}).forEach(id=>dDoc('photos',id));dDoc('settings','main')}
  else ldel(LKEY);S={settings:null,products:[],moves:[],photos:{}};recalc();closeSheet();render()}

init();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
